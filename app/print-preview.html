<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Preview - WEVEN Zaemit IR</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

  <!-- Copy base styles from index.html for slide rendering -->
  <link rel="stylesheet" href="print-preview.css">

  <!-- Inline critical styles from index.html for slides -->
  <style>
    /* Base variables - 다크 테마용 기본값 (IR의 CSS가 주입되면 덮어씌워짐) */
    :root {
      --dark: #0A0E27;
      --text: #fff;
      --text-muted: #94A3B8;
      --accent: #00D4AA;
      --accent2: #7C3AED;
      --gradient1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient2: linear-gradient(135deg, #00D4AA 0%, #7C3AED 100%);
    }

    /* Slide base - 배경/글자색은 IR의 CSS에서 정의됨 (테마 중립) */
    .slide-clone {
      /* background와 color는 IR의 .slide 스타일에서 상속됨 */
      padding: 30px 40px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    /* Section styles */
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .section-desc {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 800px;
      margin-bottom: 32px;
    }

    /* Hide elements based on language */
    [data-lang] { display: none; }
    [data-lang="ko"] { display: revert; }
    body.en [data-lang="ko"] { display: none; }
    body.en [data-lang="en"] { display: revert; }

    /* Powered badge */
    .powered-badge {
      position: absolute;
      bottom: 20px;
      left: 80px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    th {
      background: rgba(255,255,255,0.05);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Gradient text */
    .gradient-text {
      background: var(--gradient2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Common layouts */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .gap-4 { gap: 16px; }
    .gap-6 { gap: 24px; }

    /* Hero page */
    .hero-stats {
      display: flex;
      gap: 32px;
      margin-top: 32px;
    }

    /* Overview */
    .overview-layout, .ov-layout {
      display: flex;
      gap: 40px;
    }

    /* Team */
    .team-layout {
      display: flex;
      gap: 40px;
    }

    /* Pricing */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    /* Global Partners */
    .gp-countries {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    /* Animation resets for print */
    .slide-clone * {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none;
    }

    /* Re-enable specific transforms for zoom */
    .slide-clone [data-content-zoom] {
      transform: var(--content-transform) !important;
    }
  </style>
</head>
<body>

<!-- TOOLBAR -->
<div class="preview-toolbar">
  <div class="toolbar-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    <span data-lang="ko">인쇄 미리보기</span>
    <span data-lang="en">Print Preview</span>
  </div>

  <div class="toolbar-group">
    <label>
      <span data-lang="ko">콘텐츠 줌:</span>
      <span data-lang="en">Content Zoom:</span>
      <input type="range" id="globalZoomSlider" min="50" max="150" value="100">
      <span class="zoom-value" id="globalZoomValue">100%</span>
    </label>
  </div>

  <div class="toolbar-group">
    <label>
      <span data-lang="ko">타이틀 크기:</span>
      <span data-lang="en">Title Scale:</span>
      <input type="range" id="titleScaleSlider" min="50" max="100" value="100">
      <span class="zoom-value" id="titleScaleValue">100%</span>
    </label>
  </div>

  <div class="toolbar-group title-align-group">
    <span class="align-label" data-lang="ko">제목:</span>
    <span class="align-label" data-lang="en">Title:</span>
    <div class="title-align-buttons">
      <button class="title-align-btn active" data-h="left" onclick="setTitleAlignment('left')" title="Left">◀</button>
      <button class="title-align-btn" data-h="center" onclick="setTitleAlignment('center')" title="Center">●</button>
      <button class="title-align-btn" data-h="right" onclick="setTitleAlignment('right')" title="Right">▶</button>
    </div>
  </div>

  <div class="toolbar-group">
    <button class="reset-btn" onclick="resetToFit()">
      <span data-lang="ko">맞춤</span>
      <span data-lang="en">Fit</span>
    </button>
  </div>

  <div class="toolbar-group">
    <button class="toolbar-btn btn-pdf" onclick="exportPDF()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <polyline points="9 15 12 18 15 15"/>
      </svg>
      <span data-lang="ko">PDF 다운로드</span>
      <span data-lang="en">Download PDF</span>
    </button>

    <button class="toolbar-btn btn-print" onclick="browserPrint()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      <span data-lang="ko">프린트</span>
      <span data-lang="en">Print</span>
    </button>

    <button class="toolbar-btn btn-close" onclick="closePreview()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      <span data-lang="ko">닫기</span>
      <span data-lang="en">Close</span>
    </button>
  </div>
</div>

<!-- PREVIEW CONTENT -->
<div class="preview-content" id="previewContent">
  <!-- Slides will be rendered here by JavaScript -->
</div>

<!-- JavaScript -->
<script src="print-preview.js"></script>

</body>
</html>
